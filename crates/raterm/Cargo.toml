[package]
name = "raterm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal = "0.26"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false, features = ["syntect-fancy"] }
gtk = "0.18"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
toml = "1"
# The same as wry's, used directly by the native view for the web views of
# rich blocks; 2.40 for evaluate_javascript.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
wry = "0.57"
