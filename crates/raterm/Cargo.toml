[package]
name = "raterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A terminal emulator for Linux that shows Markdown, HTML, SVG, images, videos and audio inline, as rich blocks"
readme = "../../README.md"
keywords = ["terminal", "terminal-emulator", "markdown", "gtk", "webkit"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.26"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false, features = ["syntect-fancy"] }
# kitty's images sent through zlib; already built in by syntect.
flate2 = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
toml = "1"

# The view on Linux (see Spec-View).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The web views of rich blocks; 2.40 for evaluate_javascript.
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[features]
# Timestamps of the stages of a redraw, for extra/bench/trace.py.
trace = []
