<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <path id="head" d="M115 39 C127.68 39 139.73 43.4 149.66 50.7 L156.7 52.07 L157.4 57.4 L163.45 58.91 L162.41 63.43 L168.49 65.98 L166.71 70.45 C169.82 76.37 172.16 83.04 173.5 90 C175 102 173 111 168 116.5 C162 122.5 154 126 140 128.3 C132.5 129.8 126 130.5 118 130.5 C108.5 130.5 100.5 129.3 92 127.2 C72 124.5 60.5 117 60.5 104 C60.5 99 61 95 62 92 C62.05 91.69 62.1 91.39 62.16 91.08 L58.73 87.03 L64.33 82.14 L61.63 77.65 L67.62 73.41 L65.71 68.57 L72.04 65.06 C73.54 62.62 75.19 60.26 77 58 C87 46 100 39 115 39 Z"/>
    <ellipse id="ear-l" cx="52.5" cy="61.5" rx="33.5" ry="35.5" transform="rotate(10 52 60)"/>
    <ellipse id="ear-r" cx="165.5" cy="47.5" rx="30.5" ry="33.5" transform="rotate(-15 166 46)"/>
    <!-- The pink overflows each ear towards the outside, so that it only shows a gray rim towards the head. -->
    <ellipse id="pink-l" cx="42" cy="65.5" rx="30" ry="35.5" transform="rotate(5 42 65.5)"/>
    <ellipse id="pink-r" cx="173" cy="50.5" rx="23" ry="31.5" transform="rotate(-15 173 50.5)"/>
    <!-- Left paw, tilted inwards: a half ellipse over three toes, the outer ones quarter ellipses, separated by spikes that taper off upwards. -->
    <g id="paw" transform="rotate(-8 80 126)">
      <path d="M67.5 126 A12.5 8.8 0 0 1 92.5 126 C92.5 131 90.5 134.4 88 134.4 C86.2 134.4 84.9 133.2 84.4 131.6 C83.6 134.4 82 135.4 80 135.4 C78 135.4 76.4 134.4 75.6 131.6 C75.1 133.2 73.8 134.4 72 134.4 C69.5 134.4 67.5 131 67.5 126 Z"/>
      <!-- Each spike starts as wide as the outline, covering the round join of the dip, then narrows smoothly into a thin point. -->
      <path d="M74.2 131.6 C74.6 130 75.5 129.6 75.6 126.2 C75.7 129.6 76.6 130 77 131.6 Z M83 131.6 C83.4 130 84.3 129.6 84.4 126.2 C84.5 129.6 85.4 130 85.8 131.6 Z" fill="#1a1b29" stroke="none"/>
    </g>
    <clipPath id="ears"><use href="#ear-l"/><use href="#ear-r"/></clipPath>
    <clipPath id="pinks"><use href="#pink-l"/><use href="#pink-r"/></clipPath>
    <!-- The pinks with their outline, so that the edge of the head inside them joins that outline. -->
    <mask id="pinks-outlined"><g fill="#fff" stroke="#fff" stroke-width="4"><use href="#pink-l"/><use href="#pink-r"/></g></mask>
  </defs>
  <g stroke="#1a1b29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M199 128 C204 118 207 110 207 100 C207 90 208 80 214 73 C220 66 228 61 239 61 A3.5 3.5 0 0 1 241 67 C234 68 230 72 227 77 C222 85 221 92 221 100 C221 110 220 118 216 128 Z" fill="#fba5a6"/>

    <rect x="17" y="124" width="206" height="118" rx="22" fill="#4a4c68"/>
    <rect x="30" y="138" width="180" height="90" rx="10" fill="#13151f" stroke="none"/>
    <path d="M56 160 L98 184 L56 208" fill="none" stroke="#ebecf3" stroke-width="13"/>
    <rect x="107" y="202" width="42" height="11" rx="2" fill="#ebecf3" stroke="none"/>

    <!-- Stroking ears and head, then filling them again, outlines only their union. The fill hides the inner half of the stroke: the head's is doubled for it, the ears' gets its inner half back once their pink is drawn. -->
    <g fill="#9d99ae">
      <g>
        <use href="#ear-l"/>
        <use href="#ear-r"/>
        <use href="#head" stroke-width="8"/>
      </g>
      <g stroke="none">
        <use href="#ear-l"/>
        <use href="#ear-r"/>
        <use href="#head"/>
      </g>
    </g>
    <!-- The light patch goes under the pink's outline, drawn last. -->
    <g clip-path="url(#ears)">
      <g fill="#fa9b9c" stroke="none">
        <use href="#pink-l"/>
        <use href="#pink-r"/>
      </g>
      <g fill="#fdb7b0" stroke="none" clip-path="url(#pinks)">
        <ellipse cx="40" cy="74" rx="19" ry="22"/>
        <ellipse cx="181" cy="54" rx="15" ry="22" transform="rotate(-15 181 54)"/>
      </g>
      <g fill="none">
        <use href="#pink-l"/>
        <use href="#pink-r"/>
      </g>
    </g>
    <!-- Over the pink, so that where the pink's outline meets the ear's they merge without a seam. -->
    <g fill="none">
      <use href="#ear-l"/>
      <use href="#ear-r"/>
    </g>
    <!-- The head covers the ears, and its edge is drawn only where it meets their pink: doubled and under the fill, so that it lies outside the head like the rest of its outline. -->
    <use href="#head" fill="none" stroke-width="8" mask="url(#pinks-outlined)"/>
    <use href="#head" fill="#9d99ae" stroke="none"/>

    <!-- White with a dark edge, so that the whiskers show on the face and on any background; they taper to their tips. -->
    <path d="M93.54 111.54 Q62.27 94.52 36 110 Q61.73 95.48 92.46 113.46 A1.1 1.1 0 0 0 93.54 111.54 Z M93.46 115.5 Q64.23 102.5 39 121 Q63.77 103.5 92.54 117.5 A1.1 1.1 0 0 0 93.46 115.5 Z M155.64 106.39 Q178.32 89.45 197 94 Q177.68 88.55 154.36 104.61 A1.1 1.1 0 0 0 155.64 106.39 Z M156.55 110.95 Q180.28 96.48 199 108 Q179.72 95.52 155.45 109.05 A1.1 1.1 0 0 0 156.55 110.95 Z" fill="#fff" stroke-width="1.4" paint-order="stroke"/>

    <path d="M90 75 Q95 71 100 72 M142 66 Q146 63 150 65" fill="none" stroke-width="2"/>
    <g fill="#1a1b29" stroke="none">
      <ellipse cx="97" cy="96" rx="12" ry="13"/>
      <ellipse cx="151" cy="90" rx="10" ry="12"/>
    </g>
    <g fill="#fff" stroke="none">
      <circle cx="100" cy="90" r="4"/>
      <circle cx="148" cy="84" r="3.5"/>
    </g>
    <path d="M125 105.5 C125 102.5 129 102 132.5 102 C136 102 140 102.5 140 105.5 C140 109.5 136 113 132.5 113 C129 113 125 109.5 125 105.5 Z" fill="#f7a3a8" stroke="none"/>
    <ellipse cx="134" cy="105" rx="3.5" ry="1.6" fill="#fde0de" stroke="none"/>
    <path d="M133 113 V117 M114.5 114 C115.5 120 119 122.5 123.5 122.5 C128.5 122.5 132 120.5 133 117 C134 120.5 137.5 122 141.5 122 C145.5 122 147.5 118 147.5 113" fill="none" stroke-width="2.2"/>

    <g fill="#fba5a6" stroke-width="2.6">
      <use href="#paw"/>
      <use href="#paw" transform="translate(242.25 0) scale(-1 1)"/>
    </g>
  </g>
</svg>
